<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Happy Birthday Bby <3</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app">
        <section id="page1" class="page full-page">
            <img class="title-img" src="happy-title.png" alt="Happy Birthday to My Sweet Heart">

            <div class="letter-card">
                <img src="letter-content.png" alt="letter">
            </div>

            <div class="marquee-wrap">
                <div class="marquee-track" id="marqueeTrack"></div>
            </div>

            <button class="open-gift-btn" id="openGiftBtn" aria-label="Open your gift">
                <img src="btn-open-gift.png" alt="Open your Gift">
            </button>
        </section>
    </div>

    <div class="toast" id="toast"></div>
    <div class="hearts-burst" id="heartsBurst"></div>

    <script src="script.js"></script>

</body>
</html>
