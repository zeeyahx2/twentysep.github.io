<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>My Coupons - Happy Birthday</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app">
        <section id="page2" class="page scrollable-page">
            <a href="index.html" class="back-btn">‹ กลับหน้าแรก</a>

            <div class="coupon-grid" id="couponGrid"></div>
            <button class="secret-trigger" id="secretTrigger" aria-label="secret">♡</button>
        </section>
    </div>

    <div class="modal-bg" id="modalBg">
        <div class="modal-card">
            <button class="modal-close" id="modalClose">✕</button>
            <div class="modal-canvas-wrap">
                <canvas id="cpCanvas" width="1350" height="1080"></canvas>
            </div>
            <div class="modal-actions">
                <button class="btn btn-primary" id="useBtn">ใช้คูปองนี้เลย</button>
                <button class="btn btn-secondary" id="saveBtn">บันทึกเป็นรูปภาพ</button>
            </div>
            <p class="modal-note" id="modalNote"></p>
        </div>
    </div>

    <div class="toast" id="toast"></div>
    <div class="hearts-burst" id="heartsBurst"></div>

    <script src="script.js"></script>
</body>
</html>
